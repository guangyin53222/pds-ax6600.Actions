name: AX6600-Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      REPO_URL:
        description: '源码地址'
        required: true
        default: 'https://github.com/immortalwrt/immortalwrt'
      REPO_BRANCH:
        description: '源码分支'
        required: true
        default: 'master'
      FEEDS_CONF:
        description: 'feeds配置文件名'
        required: true
        default: 'feeds.conf.default'
      CONFIG_FILE:
        description: '.config配置文件名'
        required: true
        default: '.config'
      DIY_P1_SH:
        description: 'diy-part1脚本'
        required: true
        default: 'diy-part1.sh'
      DIY_P2_SH:
        description: 'diy-part2脚本'
        required: true
        default: 'diy-part2.sh'
      UPLOAD_BIN_DIR:
        description: '上传bin目录? true/false'
        required: false
        default: 'false'
      UPLOAD_FIRMWARE:
        description: '上传固件? true/false'
        required: false
        default: 'true'
      UPLOAD_COWTRANSFER:
        description: '奶牛快传'
        required: false
        default: 'false'
      UPLOAD_WETRANSFER:
        description: 'wetransfer'
        required: false
        default: 'false'
      UPLOAD_RELEASE:
        description: '发布Release'
        required: false
        default: 'true'
      TZ:
        description: '时区'
        required: true
        default: 'Asia/Shanghai'

env:
  REPO_URL: ${{ github.event.inputs.REPO_URL }}
  REPO_BRANCH: ${{ github.event.inputs.REPO_BRANCH }}
  FEEDS_CONF: ${{ github.event.inputs.FEEDS_CONF }}
  CONFIG_FILE: ${{ github.event.inputs.CONFIG_FILE }}
  DIY_P1_SH: ${{ github.event.inputs.DIY_P1_SH }}
  DIY_P2_SH: ${{ github.event.inputs.DIY_P2_SH }}
  UPLOAD_BIN_DIR: ${{ github.event.inputs.UPLOAD_BIN_DIR }}
  UPLOAD_FIRMWARE: ${{ github.event.inputs.UPLOAD_FIRMWARE }}
  UPLOAD_COWTRANSFER: ${{ github.event.inputs.UPLOAD_COWTRANSFER }}
  UPLOAD_WETRANSFER: ${{ github.event.inputs.UPLOAD_WETRANSFER }}
  UPLOAD_RELEASE: ${{ github.event.inputs.UPLOAD_RELEASE }}
  TZ: ${{ github.event.inputs.TZ }}
  MAKEFLAGS: -j$(nproc)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #====================【新增关键：磁盘扩容 + 空间清理】====================
      - name: Expand Disk Space
        run: |
          sudo apt install -y parted
          sudo parted /dev/sda resizepart 3 100%
          sudo resize2fs /dev/sda3
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      #======================================================================

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone source code
        run: |
          git clone $REPO_URL openwrt --branch $REPO_BRANCH --depth 1
          cd openwrt
          df -h

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          ./$DIY_P1_SH
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          ./$DIY_P2_SH
          cd openwrt
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j$(nproc)
          df -h

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          df -h

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin
          path: openwrt/bin

      - name: Organize firmware
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' || env.UPLOAD_COWTRANSFER == 'true' || env.UPLOAD_WETRANSFER == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          mkdir -p firmware
          find . -maxdepth 1 -type f -regextype posix-extended -regex '.*(bin|img)$' ! -name '*packages.*' -exec mv {} firmware/ \;
          echo "FIRMWARE_PATH=$PWD/firmware" >> $GITHUB_ENV

      - name: Upload firmware to artifact
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: OpenWrt_Firmware
          path: ${{ env.FIRMWARE_PATH }}

      - name: Generate Release Tag
        id: gen_tag
        if: env.UPLOAD_RELEASE == 'true'
        run: |
          echo "RELEASE_TAG=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Build Release
        uses: softprops/action-gh-release@v1
        if: env.UPLOAD_RELEASE == 'true'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Build ${{ env.RELEASE_TAG }}
          files: ${{ env.FIRMWARE_PATH }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
